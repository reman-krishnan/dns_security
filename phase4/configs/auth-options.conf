options {
    directory "/var/cache/bind";

    listen-on port 53 { any; };
    listen-on-v6 { none; };

    recursion no;
    dnssec-validation no;

    allow-query { any; };
    allow-transfer { none; };

    notify no;
    minimal-responses no;

    pid-file "/run/named/named.pid";
};

include "/run/named/rndc.key";

controls {
    inet 127.0.0.1 port 953
        allow { 127.0.0.1; }
        keys { "rndc-key"; };
};
