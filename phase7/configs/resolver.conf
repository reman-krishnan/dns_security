// Phase 7 resolver: validating recursive resolver that also speaks
// DNS-over-TLS (853) and DNS-over-HTTPS (443) using the lab PKI.
// Cleartext 53 stays enabled (upstream recursion + the cleartext-fallback path
// the Phase 7 attacks exploit against a permissive client).

tls lab-tls {
    key-file "/lab/pki/resolver.key";
    cert-file "/lab/pki/resolver.fullchain.crt";
};

options {
    directory "/var/cache/bind";
    listen-on-v6 { none; };

    // cleartext DNS (also used for upstream recursion to the auth servers)
    listen-on port 53 { any; };
    // DNS-over-TLS
    listen-on port 853 tls lab-tls { any; };
    // DNS-over-HTTPS (BIND's built-in 'http default' exposes /dns-query)
    listen-on port 443 tls lab-tls http default { any; };

    recursion yes;
    dnssec-validation yes;

    allow-query { 127.0.0.1; 172.16.1.0/24; 172.16.2.0/24; };
    allow-recursion { 127.0.0.1; 172.16.1.0/24; 172.16.2.0/24; };
    allow-query-cache { 127.0.0.1; 172.16.1.0/24; 172.16.2.0/24; };
    allow-transfer { none; };

    qname-minimization disabled;
    empty-zones-enable no;
    minimal-responses no;
    max-cache-size 64m;

    pid-file "/run/named/named.pid";
    dump-file "/var/cache/bind/cache_dump.db";
};

logging {
    channel dnssec_log {
        stderr;
        severity debug 3;
        print-category yes;
        print-severity yes;
    };
    category dnssec { dnssec_log; };
};

include "/lab/configs/trust-anchors.conf";

zone "." {
    type hint;
    file "/lab/configs/root.hints";
};

include "/run/named/rndc.key";
controls {
    inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; };
};
